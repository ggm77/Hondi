<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>혼디 가게 — 제주 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: #f5ead8; }
  #map { position: absolute; inset: 0; background: #f5ead8; }
  .leaflet-tile-pane { filter: saturate(0.5) contrast(0.88) brightness(1.08); }
  .leaflet-container { font-family: "IBM Plex Sans KR", system-ui, sans-serif; background: #f5ead8; }
  .leaflet-control-attribution { font-size: 9px; background: rgba(245,234,216,.8); }
  .pin {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer;
    padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
    box-shadow: 0 3px 10px rgba(46,43,37,.18); transform: translate(-50%, -50%);
  }
  .pin-accent { background: #c67139; color: #f5ead8; }
  .pin-sage { background: #7a8a5e; color: #f5ead8; }
  .pin-quiet { background: #f9f4ed; color: #645c50; box-shadow: 0 1px 2px rgba(46,43,37,.14); cursor: default; }
  .pin i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .8; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  // 부모 화면(js/app.js)과 postMessage로 통신한다
  // 받는 메시지: { type: 'hondi-map-rides', rides: [{ id, originLat, originLon, destLat, destLon, label }] }
  // 보내는 메시지: { type: 'hondi-map-ready' }, { type: 'hondi-map-open', id }
  const map = L.map('map', { center: [33.385, 126.545], zoom: 9, zoomControl: false, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 18
  }).addTo(map);

  const COLORS = [['#c67139', 'pin-accent'], ['#7a8a5e', 'pin-sage']];
  const layer = L.layerGroup().addTo(map);

  const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const label = (latlng, text, kind) => L.marker(latlng, {
    icon: L.divIcon({ className: '', iconSize: null, html: '<span class="pin ' + kind + '"><i></i>' + escapeHtml(text) + '</span>' })
  });

  label([33.3617, 126.5292], '한라산', 'pin-quiet').addTo(map);

  function draw(rides) {
    layer.clearLayers();
    const points = [];
    rides.forEach((ride, i) => {
      const [color, kind] = COLORS[i % COLORS.length];
      const origin = [ride.originLat, ride.originLon];
      const dest = [ride.destLat, ride.destLon];
      L.polyline([origin, dest], { color, weight: 4, opacity: .8, dashArray: '2 9', lineCap: 'round' }).addTo(layer);
      L.circleMarker(origin, { radius: 5, color, weight: 2, fillColor: '#f5ead8', fillOpacity: 1 }).addTo(layer);
      label(dest, ride.label, kind)
        .on('click', () => parent.postMessage({ type: 'hondi-map-open', id: ride.id }, location.origin))
        .addTo(layer);
      points.push(origin, dest);
    });
    if (points.length) map.fitBounds(points, { padding: [48, 48], maxZoom: 12 });
  }

  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || e.data?.type !== 'hondi-map-rides') return;
    draw(e.data.rides);
  });

  parent.postMessage({ type: 'hondi-map-ready' }, location.origin);
</script>
</body>
</html>
